<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merge</title>
    <script src="/StreamSaver/StreamSaver.js"></script>
</head>
<body>
    <h3>教程看文档站!
        <li>注意:浏览器需要支持流式下载!</li>
        <li>推荐使用新版本的Edge,火狐,Chrome浏览器访问</li>
    </h3>
    <script>
        // StreamSaver.js 代理配置
        window.streamSaver.mitm = "/StreamSaver/mitm.html";

        async function fetchFilesAndMerge() {
            const params = new URLSearchParams(window.location.search);
            const inputListUrl = params.get('il') ? params.get('il').replace(/"/g, '') : null;
            const outputFileName = params.get('of') ? params.get('of').replace(/"/g, '') : 'merged.bin';

            let inputFiles;
            if (inputListUrl) {
                try {
                    const response = await fetch(inputListUrl);
                    if (!response.ok) throw new Error(`无法获取文件列表: ${inputListUrl}`);
                    const text = await response.text();
                    inputFiles = text
                        .trim() // 去掉整体字符串的首尾空格
                        .split('\n') // 按行拆分
                        .map(line => line.split('#')[0].trim()) // 去除 `#` 号后面的注释，并修剪空格
                        .filter(line => line.length > 0); // 过滤空行
                } catch (error) {
                    console.error(error);
                    return;
                }
            } else {
                inputFiles = params.get('if')
                    .replace(/"/g, '')
                    .split(',')
                    .map(line => line.trim()) // 确保去除空格
                    .filter(line => line.length > 0);
            }

            console.log("文件列表:", inputFiles);

            // 创建流式写入
            const fileStream = streamSaver.createWriteStream(outputFileName);
            const writer = fileStream.getWriter();

            try {
                for (const fileUrl of inputFiles) {
                    const cleanUrl = fileUrl.replace(/\s/g, ""); // 彻底去除所有空格
                    console.log(`正在下载: ${cleanUrl}`);

                    const response = await fetch(cleanUrl);
                    if (!response.ok) throw new Error(`无法获取文件: ${cleanUrl}`);

                    const reader = response.body.getReader();
                    let done = false;

                    while (!done) {
                        const { value, done: readerDone } = await reader.read();
                        if (value) {
                            await writer.write(value); // 直接写入文件
                        }
                        done = readerDone;
                    }
                }

                console.log("所有文件合并完成！");
                await writer.close();
            } catch (error) {
                console.error("合并过程中出错:", error);
                await writer.abort();
            }
        }

        fetchFilesAndMerge();
    </script>
</body>
</html>
