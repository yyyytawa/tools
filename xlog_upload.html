<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPFS 文件上传工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            overflow: hidden; /* 防止内容溢出 */
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: clamp(1.5rem, 4vw, 2rem); /* 响应式字体大小 */
            word-wrap: break-word;
        }
        
        .description {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: clamp(0.9rem, 2.5vw, 1rem); /* 响应式字体大小 */
        }
        
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            cursor: pointer;
        }
        
        .upload-area:hover, .upload-area.dragover {
            background-color: #e3f2fd;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: clamp(2.5rem, 8vw, 3rem); /* 响应式图标大小 */
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: clamp(1rem, 3vw, 1.2rem); /* 响应式字体大小 */
            word-wrap: break-word;
        }
        
        .upload-hint {
            color: #7f8c8d;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
            word-wrap: break-word;
        }
        
        #file-input {
            display: none;
        }
        
        .file-info {
            background-color: #f1f8ff;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            word-break: break-all; /* 长文件名换行 */
        }
        
        .file-info.active {
            display: block;
        }
        
        .file-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            word-break: break-word; /* 长文件名换行 */
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
        }
        
        .upload-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: clamp(0.9rem, 2.5vw, 1rem); /* 响应式字体大小 */
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-btn:hover {
            background-color: #2980b9;
        }
        
        .upload-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .progress-container {
            margin-bottom: 20px;
            display: none;
        }
        
        .progress-container.active {
            display: block;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            text-align: center;
            color: #7f8c8d;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
        }
        
        .result {
            background-color: #f1f8ff;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            word-break: break-all; /* 长内容换行 */
        }
        
        .result.active {
            display: block;
        }
        
        .result-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-size: clamp(1rem, 3vw, 1.2rem); /* 响应式字体大小 */
        }
        
        .url-container {
            display: flex;
            margin-bottom: 15px;
            flex-direction: column; /* 小屏幕上垂直排列 */
        }
        
        @media (min-width: 480px) {
            .url-container {
                flex-direction: row; /* 大屏幕上水平排列 */
            }
        }
        
        .url-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
            margin-bottom: 10px; /* 小屏幕上的间距 */
            word-break: break-all; /* 长URL换行 */
            min-width: 0; /* 防止flex项目溢出 */
        }
        
        @media (min-width: 480px) {
            .url-input {
                border-radius: 4px 0 0 4px;
                margin-bottom: 0; /* 大屏幕上移除底部间距 */
                margin-right: 0; /* 确保没有右边距 */
            }
        }
        
        .copy-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
            white-space: nowrap; /* 防止按钮文字换行 */
        }
        
        @media (min-width: 480px) {
            .copy-btn {
                border-radius: 0 4px 4px 0;
            }
        }
        
        .copy-btn:hover {
            background-color: #27ae60;
        }
        
        .result-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        @media (min-width: 480px) {
            .result-details {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .detail-item {
            background-color: #e8f4fc;
            padding: 10px;
            border-radius: 4px;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
            word-break: break-all; /* 长内容换行 */
        }
        
        .detail-label {
            font-weight: 600;
            color: #3498db;
            display: block;
            margin-bottom: 5px;
        }
        
        .error {
            background-color: #ffeaea;
            color: #e74c3c;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            word-break: break-word; /* 错误信息换行 */
        }
        
        .error.active {
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); /* 响应式字体大小 */
        }
        
        /* 添加最大宽度限制，防止内容溢出 */
        .url-input, .detail-item, .file-name {
            max-width: 100%;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IPFS 文件上传工具</h1>
        <p class="description">上传文件到 IPFS 网络，获取可公开访问的 URL（最大文件大小：31MB）</p>
        
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击选择文件或拖拽文件到此处</div>
            <div class="upload-hint">支持图片、文档等文件类型（最大文件大小：31MB）</div>
            <input type="file" id="file-input">
        </div>
        
        <div class="file-info" id="file-info">
            <div class="file-name" id="file-name">文件名</div>
            <div class="file-size" id="file-size">文件大小</div>
        </div>
        
        <button class="upload-btn" id="upload-btn" disabled>上传文件</button>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="progress-text" id="progress-text">上传中... 0%</div>
        </div>
        
        <div class="result" id="result">
            <div class="result-title">上传成功！</div>
            <div class="url-container">
                <input type="text" class="url-input" id="url-input" readonly>
                <button class="copy-btn" id="copy-btn">复制</button>
            </div>
            <div class="result-details">
                <div class="detail-item">
                    <span class="detail-label">CID:</span> <span id="cid"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">文件大小:</span> <span id="result-size"></span>
                </div>
            </div>
        </div>
        
        <div class="error" id="error">
            <div id="error-message">错误信息</div>
        </div>
        
        <div class="footer">
            <p>使用 Crossbell IPFS 中继服务上传文件</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const fileName = document.getElementById('file-name');
            const fileSize = document.getElementById('file-size');
            const uploadBtn = document.getElementById('upload-btn');
            const progressContainer = document.getElementById('progress-container');
            const progress = document.getElementById('progress');
            const progressText = document.getElementById('progress-text');
            const result = document.getElementById('result');
            const urlInput = document.getElementById('url-input');
            const copyBtn = document.getElementById('copy-btn');
            const cid = document.getElementById('cid');
            const resultSize = document.getElementById('result-size');
            const error = document.getElementById('error');
            const errorMessage = document.getElementById('error-message');
            
            let selectedFile = null;
            const MAX_FILE_SIZE = 31 * 1024 * 1024; // 31MB in bytes
            
            // 点击上传区域触发文件选择
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleFileSelection(e.target.files[0]);
                }
            });
            
            // 拖放功能
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    handleFileSelection(e.dataTransfer.files[0]);
                }
            });
            
            // 处理文件选择
            function handleFileSelection(file) {
                // 检查文件大小（限制为31MB）
                if (file.size > MAX_FILE_SIZE) {
                    showError('文件大小超过限制，请选择小于31MB的文件');
                    return;
                }
                
                selectedFile = file;
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.classList.add('active');
                uploadBtn.disabled = false;
                
                // 隐藏之前的结果和错误
                result.classList.remove('active');
                error.classList.remove('active');
            }
            
            // 上传按钮点击事件
            uploadBtn.addEventListener('click', function() {
                if (!selectedFile) return;
                
                uploadFile(selectedFile);
            });
            
            // 复制按钮点击事件
            copyBtn.addEventListener('click', function() {
                urlInput.select();
                document.execCommand('copy');
                
                // 临时改变按钮文本
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
            
            // 上传文件函数
            function uploadFile(file) {
                const formData = new FormData();
                formData.append('file', file);
                
                // 显示进度条
                progressContainer.classList.add('active');
                uploadBtn.disabled = true;
                
                const xhr = new XMLHttpRequest();
                
                // 上传进度事件
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progress.style.width = percentComplete + '%';
                        progressText.textContent = `上传中... ${Math.round(percentComplete)}%`;
                    }
                });
                
                // 请求完成事件
                xhr.addEventListener('load', function() {
                    if (xhr.status === 200) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            
                            if (response.status === 'ok') {
                                // 显示结果
                                urlInput.value = response.web2url;
                                cid.textContent = response.cid;
                                resultSize.textContent = formatFileSize(parseInt(response.fileSize));
                                
                                progressContainer.classList.remove('active');
                                result.classList.add('active');
                            } else {
                                showError('上传失败: ' + (response.message || '未知错误'));
                            }
                        } catch (e) {
                            showError('解析响应时出错: ' + e.message);
                        }
                    } else {
                        showError('上传失败，HTTP状态码: ' + xhr.status);
                    }
                });
                
                // 请求错误事件
                xhr.addEventListener('error', function() {
                    showError('网络错误，请检查网络连接');
                });
                
                // 发送请求
                xhr.open('POST', 'https://ipfs-relay.crossbell.io/upload');
                xhr.send(formData);
            }
            
            // 显示错误信息
            function showError(message) {
                errorMessage.textContent = message;
                error.classList.add('active');
                progressContainer.classList.remove('active');
                uploadBtn.disabled = false;
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });
    </script>
</body>
</html>
